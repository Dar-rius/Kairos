[project]
name = "kairos"
version = "0.1.0"
description = "Bitcoin trading agent using Reinforcement Learning (PPO) with System 1/System 2 architecture"
readme = "README.md"
authors = [
    { name = "Dar-rius", email = "mohamedtine17@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>2",
    "torch",
]

[tool.setuptools.packages.find]
packages = ["kairos"]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu130"
default = true

